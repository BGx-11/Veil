[package]
name = "veil-browser"
version = "0.1.0"
description = "Veil Browser - Privacy-first desktop browser"
authors = ["Veil Browser Community"]
license = "MIT"
repository = "https://github.com/BGx-11/Veil"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
reqwest = { version = "0.12", features = ["json", "socks"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
readability = "0.3.0"
url = "2.5.8"
